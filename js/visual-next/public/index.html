<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MQTT Protocol Visualizer - Next Gen</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🚀 MQTT Server Visual Console (Next-Gen)</h1>
        <div class="subtitle">
          RoboMaster 2026 Custom Client Protocol - Data Configuration &
          Monitoring
        </div>
      </header>

      <div class="main-content">
        <!-- 左侧：上行消息 -->
        <div class="panel">
          <div class="panel-header">
            📥 上行消息（客户端 → 服务器）
            <span class="badge badge-up" id="uplinkCount">0</span>
          </div>
          <div class="panel-body" id="uplinkMessages">
            <p class="loading-text">加载中...</p>
          </div>
        </div>

        <!-- 右侧：下行消息 -->
        <div class="panel">
          <div class="panel-header">
            📤 下行消息（服务器 → 客户端）
            <span class="badge badge-down" id="downlinkCount">0</span>
          </div>
          <div class="panel-body" id="downlinkMessages">
            <p class="loading-text">加载中...</p>
          </div>
        </div>
      </div>

      <!-- 历史记录 -->
      <div class="panel" style="margin-top: 30px">
        <div class="panel-header">
          📜 通信历史
          <button
            class="btn btn-secondary"
            onclick="refreshHistory()"
            style="margin-left: auto"
          >
            刷新
          </button>
        </div>
        <div class="panel-body" id="historyPanel">
          <p class="loading-text">暂无历史记录</p>
        </div>
      </div>

      <footer class="footer">
        Originally By MeroT, Adopted By Loris @ Taurus Team, 2026
      </footer>
    </div>

    <script src="/js/ui-render.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
